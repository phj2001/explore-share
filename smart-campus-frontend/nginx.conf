server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传体积上限：后端 multipart 限 10MB，nginx 默认仅 1MB 会先行 413，须放宽并留余量
    client_max_body_size 12m;

    # AI 助手 SSE 流式对话专用：必须禁用代理缓冲（否则增量输出被 nginx 攒批，前端"卡住不动"），
    # 且读超时需大于后端 SseEmitter 的 2 分钟，避免流被 nginx 提前掐断
    location /api/assistant/chat {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 150s;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 用户上传文件反代（头像 / 分享图 / 活动图 / 路线图）
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Vue SPA history 模式路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
