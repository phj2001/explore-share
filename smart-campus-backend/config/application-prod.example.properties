# Copy this file to application-prod.properties on the server and keep the real values private.

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/place_explore
spring.datasource.username=place_app
spring.datasource.password=replace-with-a-strong-password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.forward-headers-strategy=framework
