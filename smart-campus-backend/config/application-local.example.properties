# Copy this file to application-local.properties and keep the real values local.

# Either keep using spring.* / jwt.* here, or set DB_PASSWORD and JWT_SECRET in your IDE run configuration.
spring.datasource.url=jdbc:postgresql://localhost:5432/campus_map
spring.datasource.username=postgres
spring.datasource.password=your-postgres-password
jwt.secret=replace-with-a-long-random-secret
amap.web.key=replace-with-your-amap-web-service-key

# ---------- AI 探索助手 ----------
#app.assistant.enabled=true
# 共用 key：对话与向量默认走同一家（DashScope OpenAI 兼容）
#spring.ai.openai.api-key=replace-with-your-dashscope-api-key

# （可选）对话模型单独换厂商：任意 OpenAI 兼容接口，随便换、无副作用
#spring.ai.openai.chat.base-url=https://api.deepseek.com/v1
#spring.ai.openai.chat.api-key=replace-with-chat-vendor-key
#spring.ai.openai.chat.options.model=deepseek-chat

# （可选）向量模型单独换厂商：⚠️ 维度必须 1024；换后需 POST /api/assistant/admin/embed-all
# 重建索引 + TRUNCATE assistant_cache 清缓存（旧向量与新语义空间不可比）
