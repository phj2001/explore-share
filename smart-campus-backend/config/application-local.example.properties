# Copy this file to application-local.properties and keep the real values local.

# Either keep using spring.* / jwt.* here, or set DB_PASSWORD and JWT_SECRET in your IDE run configuration.
spring.datasource.url=jdbc:postgresql://localhost:5432/campus_map
spring.datasource.username=postgres
spring.datasource.password=your-postgres-password
jwt.secret=replace-with-a-long-random-secret
amap.web.key=replace-with-your-amap-web-service-key
