# Base application settings
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:file:config/application-local.properties

# Service
server.port=${SERVER_PORT:8080}
server.compression.enabled=true
server.compression.min-response-size=2KB
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
spring.application.name=smart-campus-backend

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.security.super-admin.username=${SUPER_ADMIN_USERNAME:}
app.security.super-admin.password=${SUPER_ADMIN_PASSWORD:}
app.security.allowed-origin-patterns=${APP_SECURITY_ALLOWED_ORIGIN_PATTERNS:}
app.upload.avatar-dir=${APP_UPLOAD_AVATAR_DIR:uploads/avatars}
app.upload.poi-share-dir=${APP_UPLOAD_POI_SHARE_DIR:uploads/poi-shares}
app.upload.announcement-dir=${APP_UPLOAD_ANNOUNCEMENT_DIR:uploads/announcements}
app.upload.activity-dir=${APP_UPLOAD_ACTIVITY_DIR:uploads/activities}
app.upload.route-dir=${APP_UPLOAD_ROUTE_DIR:uploads/routes}

# AMap Web Service
amap.web.key=${AMAP_WEB_KEY:}
amap.web.base-url=${AMAP_WEB_BASE_URL:https://restapi.amap.com}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}

