# Base application settings
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:classpath:application-local.properties,optional:file:config/application-local.properties

# Service
server.port=${SERVER_PORT:8080}
spring.application.name=smart-campus-backend

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.security.super-admin.username=${SUPER_ADMIN_USERNAME:admin}
app.security.super-admin.password=${SUPER_ADMIN_PASSWORD:admin123}

# AMap Web Service
amap.web.key=${AMAP_WEB_KEY:}
amap.web.base-url=${AMAP_WEB_BASE_URL:https://restapi.amap.com}
