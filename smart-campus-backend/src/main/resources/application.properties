# Base application settings
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:file:config/application-local.properties

# Service
server.port=${SERVER_PORT:8080}
server.compression.enabled=true
server.compression.min-response-size=2KB
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
spring.application.name=discover-share-places

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.security.super-admin.username=${SUPER_ADMIN_USERNAME:}
app.security.super-admin.password=${SUPER_ADMIN_PASSWORD:}
app.security.allowed-origin-patterns=${APP_SECURITY_ALLOWED_ORIGIN_PATTERNS:}
# 登录风控（升级项③）
app.security.login-risk-control-enabled=${LOGIN_RISK_ENABLED:true}
app.security.login-max-failures=${LOGIN_MAX_FAILURES:5}
app.security.login-lock-duration-seconds=${LOGIN_LOCK_SECONDS:900}
app.security.login-counter-ttl-seconds=${LOGIN_COUNTER_TTL:1800}
app.upload.avatar-dir=${APP_UPLOAD_AVATAR_DIR:uploads/avatars}
app.upload.poi-share-dir=${APP_UPLOAD_POI_SHARE_DIR:uploads/poi-shares}
app.upload.announcement-dir=${APP_UPLOAD_ANNOUNCEMENT_DIR:uploads/announcements}
app.upload.activity-dir=${APP_UPLOAD_ACTIVITY_DIR:uploads/activities}
app.upload.route-dir=${APP_UPLOAD_ROUTE_DIR:uploads/routes}

# AMap Web Service
amap.web.key=${AMAP_WEB_KEY:}
amap.web.base-url=${AMAP_WEB_BASE_URL:https://restapi.amap.com}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}

# Mail (QQ SMTP)
spring.mail.host=smtp.qq.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtps
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

app.email.from=${MAIL_USERNAME:}

# ---------- Actuator & Prometheus（升级项① 可观测性）----------
# SB4 + micrometer 2.x：prometheus registry 由 classpath 自动激活，仅需暴露端点
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
# 指标通用标签（application/module）由 ObservabilityConfig 注入

# ---------- 日志 pattern（含 traceId，升级项①）----------
# [%X{traceId:-}] 从 MDC 取 traceId，无则留空；由 RequestTraceFilter 写入 MDC
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%-5p) %clr([%15.15t]){faint} %clr([%X{traceId:-}]){yellow} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx

# ---------- 通知 Outbox（升级项④ 异步可靠投递）----------
app.notification.outbox.dispatcher-enabled=${OUTBOX_DISPATCHER_ENABLED:true}
app.notification.outbox.batch-size=${OUTBOX_BATCH_SIZE:20}
app.notification.outbox.retry-delay-seconds=${OUTBOX_RETRY_DELAY_SECONDS:120}
app.notification.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:5}
app.notification.outbox.dispatch-interval-ms=${OUTBOX_DISPATCH_INTERVAL_MS:15000}
app.notification.outbox.rabbitmq.enabled=${RABBITMQ_ENABLED:true}
app.notification.outbox.rabbitmq.exchange=discover.notification.event
app.notification.outbox.rabbitmq.queue=discover.notification.event.queue
app.notification.outbox.rabbitmq.binding-routing-key=notification.#
app.notification.outbox.rabbitmq.dead-letter-exchange=discover.notification.event.dlx
app.notification.outbox.rabbitmq.dead-letter-queue=discover.notification.event.dlq
app.notification.outbox.rabbitmq.dead-letter-routing-key=notification.dead

# ---------- RabbitMQ Listener 重试策略（消费失败 3 次后路由死信）----------
spring.rabbitmq.listener.simple.retry.enabled=${RABBITMQ_RETRY_ENABLED:true}
spring.rabbitmq.listener.simple.retry.max-attempts=${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ---------- Spring AI · AI 探索助手（DashScope OpenAI 兼容）----------
# 独立模块总开关：默认关闭，开启需 ASSISTANT_ENABLED=true（任务规则 6：不破坏已上线主功能）
app.assistant.enabled=${ASSISTANT_ENABLED:false}
app.assistant.retrieval.radius-meters=${ASSISTANT_RADIUS:3000}
app.assistant.retrieval.top-k=${ASSISTANT_TOPK:10}
# DashScope OpenAI 兼容端点（chat: qwen-plus）；embedding(text-embedding-v3) 在 M1 引入 pgvector 后启用
spring.ai.openai.base-url=${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
# api-key 走环境变量；占位非空值避免 assistant 关闭时 OpenAiChatModel autoconfigure 因空 key 异常
spring.ai.openai.api-key=${DASHSCOPE_API_KEY:disabled-when-assistant-off}
spring.ai.openai.chat.options.model=${LLM_MODEL:qwen-plus}
spring.ai.openai.chat.options.temperature=0.7
# Embedding（M1 启用）：text-embedding-v3，1024 维，对齐 poi_embedding.embedding 的 vector(1024)
spring.ai.openai.embedding.options.model=${EMBED_MODEL:text-embedding-v4}
# ---------- M4 生产级层：语义缓存 / 限流 / 护栏 ----------
app.assistant.cache.enabled=${ASSISTANT_CACHE_ENABLED:true}
app.assistant.cache.similarity-threshold=${ASSISTANT_CACHE_THRESHOLD:0.95}
app.assistant.cache.ttl-seconds=${ASSISTANT_CACHE_TTL:86400}
app.assistant.rate-limit.enabled=${ASSISTANT_RL_ENABLED:true}
app.assistant.rate-limit.per-user-per-min=${ASSISTANT_RL_PER_MIN:20}
app.assistant.guard.max-message-length=${ASSISTANT_GUARD_MAXLEN:500}
