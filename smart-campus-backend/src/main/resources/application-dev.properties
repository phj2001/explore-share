spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
# SQL 日志默认关闭（刷屏影响排查业务日志）。需要看 SQL 时临时打开，两种方式：
#   ① 环境变量：SHOW_SQL=true mvn spring-boot:run（快速看语句）
#   ② 更推荐走日志框架（可看绑定参数、可按包过滤，且不经 System.out）：
#      logging.level.org.hibernate.SQL=DEBUG
#      logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.security.super-admin.username=${SUPER_ADMIN_USERNAME:admin}
app.security.super-admin.password=${SUPER_ADMIN_PASSWORD:admin123}
app.security.allowed-origin-patterns=${APP_SECURITY_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173}
